// Only pre-link passages automatically when every translation has the
// same number of complete paragraphs. Never guess alignment by length.
function alignedReadingBlocks(translations) {
  const proposal = suggestBlocks(translations || {});
  return proposal.mode === "paragraph" ? proposal.blocks : null;
}

async function saveState(state) {
  state=preparePublicSave(state);
  const ref = doc(firestore, "state", "main");
  await runTransaction(firestore, async tx => {
    const snap = await tx.get(ref);
    let reading = snap.data()?.readingFollow || null;
    const share = (state.shares || []).find(s => s.id === state.activeShareId);
    const validBlocks = blocks => Array.isArray(blocks) && blocks.length && ["it","en","fr","es","pt"].every(l => blocks.map(b=>b[l]||"").join("") === (share?.translations?.[l]?.body || ""));
    if ((state.displayMode || "one") !== "one" || !share) reading = null;
    else if (reading?.shareId !== share.id || !validBlocks(reading?.blocks)) {
      const blocks = validBlocks(share.readingBlocks) ? share.readingBlocks : alignedReadingBlocks(share.translations);
      reading = validBlocks(blocks) ? {shareId:share.id,session:crypto.randomUUID(),blocks,index:0,revision:0} : null;
    }
    tx.set(ref, {...state, readingFollow: reading});
  });
}
function subscribeState(cb) {
  return onSnapshot(doc(firestore, "state", "main"), (snap) => {
    if (snap.exists()) cb(snap.data());
    else cb(DEFAULT_STATE);
  });
}
async function initState() {
  const snap = await getDoc(doc(firestore, "state", "main"));
  if (!snap.exists()) await saveState(DEFAULT_STATE);
}

async function translateWithAI(itTitle, itBody) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1500,
        messages: [{ role: "user", content: `Translate this Italian text into English, French, Spanish, and European Portuguese. Return ONLY valid JSON, no markdown, no backticks:\n{"en":{"title":"...","body":"..."},"fr":{"title":"...","body":"..."},"es":{"title":"...","body":"..."},"pt":{"title":"...","body":"..."}}\n\nItalian title: ${itTitle}\nItalian body: ${itBody}` }]
      })
    });
    const data = await res.json();
    const raw = data.content?.[0]?.text || "{}";
    return JSON.parse(raw.replace(/```[a-z]*\n?/gi,"").replace(/```/g,"").trim());
  } catch(e) {
    return { en:{title:itTitle,body:itBody}, fr:{title:itTitle,body:itBody}, es:{title:itTitle,body:itBody}, pt:{title:itTitle,body:itBody} };
  }
}

const publicTextCache=new Map();
const publicTextLoading=new Set();
function applyPublicLocalCache(state){
  return {...state,shares:(state.shares||[]).map(share=>{
    const content=share.publicTextFile&&publicTextCache.get(share.publicTextFile);
    return content&&!(share.translations?.it?.body)
      ? hydratePublicShare(share,content,alignedReadingBlocks):share;
  })};
}
function loadPublicInBackground(state){
  for(const share of state.shares||[]){
    const file=share.publicTextFile;
    if(!file||publicTextCache.has(file)||publicTextLoading.has(file))continue;
    publicTextLoading.add(file);
    loadPublicText(file).then(content=>{
      publicTextCache.set(file,content);
      appState=applyPublicLocalCache(persistedState);
      render();
    }).catch(err=>{
      console.error('Relazione GitHub non disponibile:',file,err);
    }).finally(()=>publicTextLoading.delete(file));
  }
}

function e(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style") Object.assign(el.style, v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v);
  }
  for (const child of children.flat()) {
    if (child == null) continue;
    el.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return el;
}

function getActiveShares() {
  const mode = appState.displayMode || "one";
  const all = appState.shares || [];
  if (mode === "one") {
    const s = all.find(s => s.id === appState.activeShareId);
    return s ? [s] : [];
  } else if (mode === "selected") {
    const ids = appState.selectedShareIds || [];
    return all.filter(s => ids.includes(s.id));
  } else {
    return all;
  }
}

// ═══ SHARE FORM ═══
function renderShareForm(sections, isLibrary) {
  const inp = (placeholder, val, onChange) => {
    const el = e("input", { placeholder, style:{width:"100%", padding:"10px 14px", borderRadius:"8px", border:"1px solid rgba(200,169,110,0.25)", background:"rgba(255,255,255,0.04)", color:"#e8dcc8", fontSize:"15px"} });
    el.value = val||"";
    el.addEventListener("input", ev => onChange(ev.target.value));
    return el;
  };
  const ta = (placeholder, val, onChange) => {
    const el = e("textarea", { placeholder, rows:"3", style:{width:"100%", padding:"10px 14px", borderRadius:"8px", border:"1px solid rgba(200,169,110,0.25)", background:"rgba(255,255,255,0.04)", color:"#e8dcc8", fontSize:"14px", resize:"vertical", lineHeight:"1.6"} });
    el.value = val||"";
    el.addEventListener("input", ev => onChange(ev.target.value));
    return el;
  };

  const form = isLibrary ? libForm : adminForm;
  const editId = isLibrary ? libEditId : adminEditId;

  const sectionSel = !isLibrary ? (() => {
    const sel = e("select", { style:{width:"100%", padding:"10px 14px", borderRadius:"8px", border:"1px solid rgba(200,169,110,0.25)", background:"#1a1a2e", color:"#e8dcc8", fontSize:"15px"} },
      ...sections.map(sec => {
        const opt = e("option", { value:sec.id }, sec.icon+" "+sec.label);
        if (form.sectionId===sec.id) opt.selected=true;
        return opt;
      })
    );
    sel.addEventListener("change", ev => { form.sectionId=ev.target.value; });
    return sel;
  })() : null;

  const translateBtn = e("button", {
    style:{marginTop:"16px", width:"100%", padding:"11px", borderRadius:"10px", border:"1px solid rgba(100,180,255,0.35)", background:"rgba(100,180,255,0.07)", color:"#90c8ff", cursor:"pointer", fontSize:"14px", fontWeight:"600"},
    onClick: async () => {
      if (!form.translations.it.title && !form.translations.it.body) { alert("Inserisci prima il testo italiano!"); return; }
      translateBtn.textContent = "⏳ Traduzione in corso…";
      translateBtn.disabled = true;
      const translated = await translateWithAI(form.translations.it.title, form.translations.it.body);
      Object.assign(form.translations, translated);
      render();
    }
  }, "🤖 Traduci automaticamente nelle altre 4 lingue");

  const langBlocks = ["en","fr","es","pt"].map(code =>
    e("div", { style:{marginTop:"16px", paddingTop:"16px", borderTop:"1px solid rgba(200,169,110,0.1)"} },
      e("div", { style:{fontSize:"14px", color:"#a09080", marginBottom:"8px"} }, LANG_FLAGS[code]+" "+LANG_NAMES[code]),
      inp("Titolo", form.translations[code]?.title, v=>{ form.translations[code].title=v; }),
      e("div", { style:{marginTop:"8px"} }, ta("Testo…", form.translations[code]?.body, v=>{ form.translations[code].body=v; }))
    )
  );

  const saveAction = isLibrary ? saveLibForm : saveForm;
  const cancelAction = isLibrary
    ? () => { libForm=null; libEditId=null; adminTab="library"; render(); }
    : () => { adminTab="list"; adminForm=null; adminEditId=null; render(); };

  return e("div", { style:{maxWidth:"620px"} },
    e("h3", { style:{fontSize:"20px", color:"#c8a96e", marginBottom:"20px"} },
      editId ? "✏️ Modifica condivisione" : (isLibrary ? "📦 Nuova condivisione in Libreria" : "➕ Nuova condivisione")
    ),
    isLibrary ? e("div", { style:{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px", marginBottom:"16px"} },
      (() => {
        const el = inp("Nome coppia (es. Ugo e Anna)", form.coupleName, v=>{ form.coupleName=v; });
        return e("div", {},
          e("label", { style:{fontSize:"12px", color:"#a09080", display:"block", marginBottom:"4px"} }, "👫 Nome coppia"),
          el
        );
      })(),
      (() => {
        const el = inp("Comunità/Paese (es. Italia)", form.community, v=>{ form.community=v; });
        return e("div", {},
          e("label", { style:{fontSize:"12px", color:"#a09080", display:"block", marginBottom:"4px"} }, "🌍 Comunità"),
          el
        );
      })(),
      (() => {
        const el = inp("Giorno (es. Sabato 28 nov)", form.day, v=>{ form.day=v; });
        return e("div", {},
          e("label", { style:{fontSize:"12px", color:"#a09080", display:"block", marginBottom:"4px"} }, "📅 Giorno"),
          el
        );
      })(),
      (() => {
        const el = inp("Orario (es. 21:30)", form.time, v=>{ form.time=v; });
        return e("div", {},
          e("label", { style:{fontSize:"12px", color:"#a09080", display:"block", marginBottom:"4px"} }, "🕐 Orario"),
          el
        );
      })()
    ) : null,
    !isLibrary ? e("div", {},
      e("label", { style:{display:"block", fontSize:"12px", color:"#a09080", letterSpacing:"1px", textTransform:"uppercase", marginBottom:"6px"} }, "Sezione del weekend"),
      sectionSel
    ) : null,
    e("div", {style:{marginTop:"16px", padding:"12px",border:"1px solid rgba(200,169,110,.3)",borderRadius:"10px"}},
      e("label", {style:{display:"block",marginBottom:"8px",color:"#e8c87a",fontSize:"14px"}}, "🎙️ Lingua parlata dal relatore"),
      (()=>{const sel=e("select",{style:{width:"100%",padding:"10px",borderRadius:"8px",background:"#1a1a2e",color:"#e8dcc8",fontSize:"15px"},onChange:ev=>{form.speakerLanguage=ev.target.value;}});
        for(const [code,label] of [["","Da impostare"],["it","Italiano"],["es","Español"],["fr","Français"],["en","English"],["pt","Português"]]){const opt=e("option",{value:code},label);if((form.speakerLanguage||"")===code)opt.selected=true;sel.append(opt);}
        return sel;})(),
      e("p",{style:{fontSize:"12px",color:"#a09080",marginTop:"8px"}},"Il microfono userà automaticamente questa lingua quando attivi la condivisione. Non cambia le lingue visualizzate dalle coppie.")
    ),
    e("label", { style:{display:"block", fontSize:"12px", color:"#a09080", letterSpacing:"1px", textTransform:"uppercase", marginBottom:"6px", marginTop:"16px"} }, "URL immagine (opzionale)"),
    inp("https://…", form.imageUrl, v=>{ form.imageUrl=v; }),
    e("div", { style:{marginTop:"20px", padding:"16px", borderRadius:"12px", border:"1px solid rgba(200,169,110,0.35)", background:"rgba(200,169,110,0.05)"} },
      e("div", { style:{fontSize:"15px", color:"#c8a96e", marginBottom:"10px", fontWeight:"600"} }, "🇮🇹 Italiano — testo di partenza"),
      inp("Titolo", form.translations.it.title, v=>{ form.translations.it.title=v; }),
      e("div", { style:{marginTop:"10px"} }, ta("Testo della condivisione…", form.translations.it.body, v=>{ form.translations.it.body=v; }))
    ),
    translateBtn,
    ...langBlocks,
    e("div", { style:{display:"flex", gap:"12px", marginTop:"24px"} },
      e("button", { style:{padding:"10px 28px", borderRadius:"20px", border:"none", background:"linear-gradient(135deg, #c8a96e, #e8c87a)", color:"#0d0d1a", fontWeight:"700", cursor:"pointer", fontSize:"15px"}, onClick:saveAction }, "💾 Salva"),
      e("button", { style:{padding:"10px 20px", borderRadius:"20px", border:"1px solid rgba(200,169,110,0.3)", background:"transparent", color:"#a09080", cursor:"pointer", fontSize:"15px"}, onClick:cancelAction }, "Annulla")
    )
  );
}

// ═══ ADMIN VIEW ═══
function renderAdmin() {
  if (!adminAuth) {
    const emailInput = e("input", { type:"email", placeholder:"Email amministratore", autocomplete:"username", style:{width:"100%", padding:"10px 14px", borderRadius:"8px", border:"1px solid rgba(200,169,110,0.3)", background:"rgba(255,255,255,0.05)", color:"#e8dcc8", fontSize:"15px", marginBottom:"10px"} });
    const passwordInput = e("input", { type:"password", placeholder:"Password", autocomplete:"current-password", style:{width:"100%", padding:"10px 14px", borderRadius:"8px", border:"1px solid rgba(200,169,110,0.3)", background:"rgba(255,255,255,0.05)", color:"#e8dcc8", fontSize:"15px"} });
    const errMsg = e("p", { style:{color:"#ff6b6b", fontSize:"13px", marginTop:"8px", display:"none"} }, "Email o password non corretti");
    const tryLogin = async () => {
      errMsg.style.display = "none";
      try {
        const cred = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        if (cred.user.uid !== ADMIN_UID) {
          await signOut(auth);
          errMsg.textContent = "Questo account non è autorizzato come amministratore";
          errMsg.style.display = "block";
          return;
        }
        adminAuth = true;
        render();
      } catch (err) {
        errMsg.textContent = "Email o password non corretti";
        errMsg.style.display = "block";
      }
    };
    passwordInput.addEventListener("keydown", ev => ev.key === "Enter" && tryLogin());
    return e("div", { style:{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center"} },
      e("div", { style:{background:"rgba(255,255,255,0.04)", border:"1px solid rgba(200,169,110,0.2)", borderRadius:"20px", padding:"40px 32px", textAlign:"center", width:"330px"} },
        e("div", { style:{fontSize:"42px", marginBottom:"8px"} }, "🔐"),
        e("h2", { style:{fontSize:"20px", color:"#c8a96e", marginBottom:"20px", fontWeight:"400"} }, "Area Amministratore"),
        emailInput, passwordInput, errMsg,
        e("button", { style:{marginTop:"16px", width:"100%", padding:"10px", borderRadius:"20px", border:"none", background:"linear-gradient(135deg, #c8a96e, #e8c87a)", color:"#0d0d1a", fontWeight:"700", cursor:"pointer", fontSize:"16px"}, onClick:tryLogin }, "Accedi")
      )
    );
  }

  const sections = [...(appState.sections || [])].sort((a,b) => a.order - b.order);
  const coupleUrl = window.location.href.replace(/#.*/,"") + "#couple";
  const mode = appState.displayMode || "one";

  const tabBtn = (t, label) => e("button", {
    style:{padding:"6px 14px", borderRadius:"20px", border:`1px solid ${adminTab===t?"#c8a96e":"rgba(200,169,110,0.2)"}`, background:adminTab===t?"rgba(200,169,110,0.15)":"transparent", color:adminTab===t?"#c8a96e":"#a09080", cursor:"pointer", fontSize:"13px"},
    onClick: () => {
      if(t==="add"){ adminFormTarget="shares"; openNewForm(null); }
      else { adminTab=t; adminForm=null; libForm=null; if(t!=="import"){ importItems=[]; importError=""; } render(); }
    }
  }, label);

  const header = e("div", { style:{display:"flex", alignItems:"center", gap:"12px", padding:"12px 20px", background:"rgba(200,169,110,0.05)", borderBottom:"1px solid rgba(200,169,110,0.12)", flexWrap:"wrap"} },
    e("span", { style:{fontSize:"17px", color:"#c8a96e", fontWeight:"600", whiteSpace:"nowrap"} }, "💞 Meeting Admin"),
    e("div", { style:{display:"flex", gap:"8px", flex:"1", flexWrap:"wrap"} },
      tabBtn("list","📋 Programma"), tabBtn("remote","📱 Telecomando"), tabBtn("add","➕ Nuova"), tabBtn("import","📥 Carica condivisioni e slide"), tabBtn("library","📦 Libreria"), tabBtn("sections","🗂️ Sezioni"), tabBtn("qr","📲 QR Code")
    ),
    e("button", { style:{padding:"6px 14px", borderRadius:"20px", border:"1px solid rgba(255,100,100,0.3)", background:"transparent", color:"#ff9090", cursor:"pointer", fontSize:"12px"}, onClick:async()=>{await signOut(auth); adminAuth=false; render();} }, "Esci")
  );

  let bodyContent;

  // ── TELECOMANDO ──
  if (adminTab === "remote") {
    bodyContent = e("div", {style:{maxWidth:"460px",margin:"0 auto"}}, reading.remotePanel());
  }
  else
  // ── TAB: PROGRAMMA ──
  if (adminTab === "list") {
    const modeBar = e("div", { style:{padding:"14px 16px", borderRadius:"12px", background:"rgba(200,169,110,0.06)", border:"1px solid rgba(200,169,110,0.15)", marginBottom:"20px"} },
      e("div", { style:{fontSize:"13px", color:"#c8a96e", fontWeight:"600", marginBottom:"10px", letterSpacing:"1px"} }, "📺 MODALITÀ VISUALIZZAZIONE COPPIE"),
      e("div", { style:{display:"flex", gap:"8px", flexWrap:"wrap"} },
        ...[
          ["one",      "🔴 Una sola",   "Le coppie vedono solo la condivisione attivata"],
          ["selected", "📋 Selezione",  "Le coppie scorrono tra quelle selezionate"],
          ["all",      "📖 Tutte",      "Le coppie vedono tutte le condivisioni"]
        ].map(([m, label, desc]) =>
          e("button", {
            style:{padding:"8px 16px", borderRadius:"10px", border:`2px solid ${mode===m?"#c8a96e":"rgba(200,169,110,0.2)"}`, background:mode===m?"rgba(200,169,110,0.15)":"transparent", color:mode===m?"#c8a96e":"#a09080", cursor:"pointer", fontSize:"13px", textAlign:"left"},
            onClick: async () => { await saveState({...appState, displayMode:m}); }
          },
            e("div", { style:{fontWeight:"600"} }, label),
            e("div", { style:{fontSize:"11px", opacity:"0.7", marginTop:"2px"} }, desc)
          )
        )
      )
    );

    const activeShares = getActiveShares();
    let statusText = "";
    if (mode === "one") {
      const active = appState.shares?.find(s => s.id === appState.activeShareId);
      statusText = active ? `Attiva: "${active?.translations?.it?.title||""}"` : "Nessuna condivisione attiva — le coppie vedono la schermata di attesa";
    } else if (mode === "selected") {
      const n = (appState.selectedShareIds||[]).length;
      statusText = n > 0 ? `${n} condivisioni selezionate` : "Nessuna selezionata — le coppie vedono la schermata di attesa";
    } else {
      statusText = `Tutte visibili (${appState.shares?.length||0}) — le coppie possono scorrere`;
    }

    const statusBar = e("div", { style:{display:"flex", alignItems:"center", gap:"10px", padding:"10px 16px", borderRadius:"10px", background:"rgba(200,169,110,0.06)", marginBottom:"20px", fontSize:"14px", color:"#a09080"} },
      e("span", { style:{width:"10px", height:"10px", borderRadius:"50%", flexShrink:"0", background:activeShares.length>0?"#4caf50":"#555", boxShadow:activeShares.length>0?"0 0 6px #4caf50":"none", display:"inline-block"} }),
      statusText
    );

    const filters = e("div", { style:{display:"flex", gap:"8px", marginBottom:"18px", flexWrap:"wrap"} },
      e("button", { style:{padding:"4px 14px", borderRadius:"20px", border:`1px solid ${filterSection==="all"?"#c8a96e":"rgba(200,169,110,0.2)"}`, background:filterSection==="all"?"rgba(200,169,110,0.15)":"transparent", color:filterSection==="all"?"#c8a96e":"#a09080", cursor:"pointer", fontSize:"12px"}, onClick:()=>{filterSection="all";render();} }, "Tutte"),
      ...sections.map(sec => e("button", {
        style:{padding:"4px 14px", borderRadius:"20px", border:`1px solid ${filterSection===sec.id?"#c8a96e":"rgba(200,169,110,0.2)"}`, background:filterSection===sec.id?"rgba(200,169,110,0.15)":"transparent", color:filterSection===sec.id?"#c8a96e":"#a09080", cursor:"pointer", fontSize:"12px"},
        onClick:()=>{filterSection=sec.id;render();}
      }, sec.icon+" "+sec.label))
    );

    const grouped = sections
      .filter(sec => filterSection==="all" || sec.id===filterSection)
      .map(sec => {
        const shares = (appState.shares||[]).filter(s=>s.sectionId===sec.id);

            // Le immagini risiedono nello ZIP pubblicato su GitHub Pages.

            await checkSlideArchive(importZip.name,importZip.batches.map(s=>s.number));
            const slides=importZip.batches.map(spec=>{

            await runTransaction(firestore, async tx => {

              const live=snap.data();
              const sameTitle=(live.shares||[]).filter(s=>s.translations?.it?.title===target.translations.it.title);
              const matches=sameTitle.filter(s=>
                langOrder.every(lang=>s.translations?.[lang]?.body===target.translations[lang].body));
              if(matches.length>1 || sameTitle.length!==matches.length)
                throw Error("Titolo duplicato o testi diversi: nessuna importazione eseguita.");

async function addPublicMeetingShare(key){
  if(!adminAuth)throw Error('Accesso amministratore richiesto.');
  const spec=PUBLIC_MEETING_PRESETS[key];
  if(!spec)throw Error('Relazione non riconosciuta.');
  const source=await loadPublicText(spec.filename);
  const sourceTitles=['it','es','fr','en','pt'].map(l=>source.translations?.[l]?.title||'');
  if(!sourceTitles.includes(spec.expectedTitle))
    throw Error('Controllo titolo: atteso «'+spec.expectedTitle+'», ricevuto «'+(source.translations?.it?.title||'vuoto')+'». Nessun dato modificato.');
  const original=source.translations;
  const languages=['it','en','fr','es','pt'];
  if(!languages.every(l=>original?.[l]?.body?.length>100))throw Error('Traduzioni GitHub incomplete.');
  const positions=spec.afterBlocks.map((afterBlock,i)=>({number:i+1,afterBlock}));
  if(spec.archive&&positions.length)await checkSlideArchive(spec.archive,positions.map(p=>p.number));
  const prepared=positions.length
    ? preparePublicSlideReading(original,positions)
    : {readingBlocks:shortenLongReadingBlocks(suggestBlocks(original).blocks,original,105),inlineSlides:[]};
  if(prepared.inlineSlides.length!==positions.length||!prepared.readingBlocks.length)
    throw Error('Passaggi e slide non sincronizzati: nessun dato modificato.');
  const meta=compactPublicShare({
    id:spec.id,sectionId:spec.sectionId,coupleName:source.coupleName,day:source.day,
    time:source.time||'',speakerLanguage:source.speakerLanguage||'it',imageUrl:'',
    translations:Object.fromEntries(languages.map(l=>[l,{title:original[l].title,body:''}])),
    publicTextFile:spec.filename,publicSlidePositions:positions,
    slideArchive:spec.archive,inlineSlides:[],readingBlocks:null,readingSegmentationVersion:2
  });
  await runTransaction(firestore,async tx=>{
    const ref=doc(firestore,'state','main'),snap=await tx.get(ref);
    if(!snap.exists())throw Error('Firebase non disponibile.');
    const state=snap.data();
    const duplicate=(state.shares||[]).some(share=>share.id===spec.id||
      share.publicTextFile===spec.filename||share.translations?.it?.title===spec.expectedTitle);
    if(duplicate)throw Error('La relazione è già nel Programma: nessuna copia aggiunta.');
    const shares=[...(state.shares||[]),meta];
    const bytes=new TextEncoder().encode(JSON.stringify({...state,shares})).length;
    if(bytes>850000)throw Error('Spazio Firebase insufficiente: nessun salvataggio.');
    tx.update(ref,{shares});
  });
  publicTextCache.set(spec.filename,source);
  importItems=[];importZip=null;importError='';importBusy=false;adminTab='list';render();
  alert('Collegamento riuscito: testo in cinque lingue su GitHub'+(positions.length?' e '+positions.length+' slide':' senza slide associate')+'. Sezione iniziale: sabato mattina. Verifica dal Programma.');
}

async function archiveRegionItaliaShare(id){
  if(!adminAuth)throw Error('Accesso amministratore richiesto.');
  if(appState.activeShareId===id)throw Error('Disattiva prima questa condivisione.');
  const source=await loadPublicText(REGION_ITALIA_FILE);
  const original=(appState.shares||[]).find(s=>s.id===id);
  if(!original||!publicTextMatches(original,source))
    throw Error('Il documento GitHub differisce dai testi presenti in Firebase: nessun dato modificato.');
  await runTransaction(firestore,async tx=>{
    const ref=doc(firestore,'state','main');
    const snap=await tx.get(ref);
    if(!snap.exists())throw Error('Firebase non disponibile.');
    const state=snap.data();
    if(state.activeShareId===id)throw Error('Relazione attiva: spostamento bloccato.');
    const current=(state.shares||[]).find(s=>s.id===id);
    if(!current||!publicTextMatches(current,source))
      throw Error('I testi sono cambiati. Nessuna modifica eseguita.');
    const archived=compactPublicShare({...current,publicTextFile:REGION_ITALIA_FILE});
    tx.update(ref,{shares:state.shares.map(s=>s.id===id?archived:s)});
  });
  publicTextCache.set(REGION_ITALIA_FILE,source);
  alert('Archiviazione riuscita. Le cinque lingue si trovano su GitHub; Firebase conserva i comandi e i metadati. Verifica la percentuale di spazio in alto.');
}

async function activateShare(id) {
  const newId=appState.activeShareId===id?null:id;
  let shares=appState.shares||[];
  if(newId){
    const candidate=shares.find(s=>s.id===newId);
    if(candidate?.publicTextFile){
      const content=await loadPublicText(candidate.publicTextFile);
      const hydrated=hydratePublicShare(candidate,content,translations=>{
        const aligned=alignedReadingBlocks(translations)||suggestBlocks(translations).blocks;
        return shortenLongReadingBlocks(aligned,translations,105);
      });
      if(candidate.publicSlidePositions?.length){
        const prepared=preparePublicSlideReading(hydrated.translations,candidate.publicSlidePositions);
        hydrated.readingBlocks=prepared.readingBlocks;
        hydrated.inlineSlides=prepared.inlineSlides;
        hydrated.readingSegmentationVersion=2;
      }else{
        // No slides: retain the existing short passage behavior.
        hydrated.readingBlocks=shortenLongReadingBlocks(hydrated.readingBlocks,hydrated.translations,105);
      }
      if(!hydrated.readingBlocks?.length)
        throw Error('Passaggi della relazione pubblica non disponibili: non attivata.');
      shares=shares.map(s=>s.id===newId?hydrated:s);
    }
  }
  await saveState({...appState,shares,activeShareId:newId});
}

async function moveShare(sectionId, idx, dir) {
  let shares = [...(appState.shares||[])];
  const secShares = shares.filter(s=>s.sectionId===sectionId);
  const otherShares = shares.filter(s=>s.sectionId!==sectionId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= secShares.length) return;
  [secShares[idx], secShares[newIdx]] = [secShares[newIdx], secShares[idx]];
  await saveState({ ...appState, shares: [...otherShares, ...secShares] });
}

  await saveState({ ...appState, sections:(appState.sections||[]).filter(s=>s.id!==id) });
}

// Misuratore in sola lettura: non cambia Firebase, microfono o condivisioni.
let migrationBusy=false;
let migrationAutoAttempted=false;
let migrationStatus='Controllo automatico non ancora avviato.';
function setMigrationStatus(value){
  migrationStatus=value;
  const node=document.getElementById('slide-migration-status');
  if(node)node.textContent=value;
}
function attemptAutomaticMigration(){
  if(migrationAutoAttempted||migrationBusy||!adminAuth||currentView!=='admin')return;
  const embedded=(appState.shares||[]).some(s=>(s.inlineSlides||[])
    .some(sl=>Object.values(sl.images||{}).some(v=>typeof v==='string'&&v.startsWith('data:image/'))));
  if(!embedded)return;
  migrationAutoAttempted=true;
  setMigrationStatus('AVVIO AUTOMATICO · Verifico ora lo ZIP GitHub, senza usare il pulsante…');
  Promise.resolve().then(()=>migrateExistingSlides()).catch(err=>{
    setMigrationStatus('ERRORE AUTOMATICO: '+(err.message||err));
    console.error('Avvio migrazione',err);
  });
}
async function migrateExistingSlides(){
  setMigrationStatus('Pulsante premuto. Controllo dei dati in corso…');
  if(migrationBusy)return;
  const candidates=(appState.shares||[]).filter(s=>
    (s.inlineSlides||[]).some(sl=>Object.values(sl.images||{})
      .some(v=>typeof v==='string'&&v.startsWith('data:image/'))));
  if(candidates.length!==1){
    setMigrationStatus('Operazione fermata: risultano '+candidates.length+' relazioni con slide incorporate. Nessuna modifica eseguita.');
    return;
  }
  const candidate=candidates[0],archive='mark_maria_luisa_slides.zip';
  migrationBusy=true;
  setMigrationStatus('1/3 · Verifica del file ZIP pubblico in corso…');
  const btn=document.getElementById('migrate-slide-archive');
  if(btn){btn.disabled=true;btn.textContent='Verifica ZIP pubblicato su GitHub…';}
  try{
    await checkSlideArchive(archive,candidate.inlineSlides.map(s=>s.number));
    setMigrationStatus('2/3 · Le slide sono disponibili. Aggiornamento Firebase in corso…');
    await runTransaction(firestore,async tx=>{
      const ref=doc(firestore,'state','main'),snap=await tx.get(ref);
      if(!snap.exists())throw Error('Documento principale non disponibile.');
      const state=snap.data(),share=(state.shares||[]).find(s=>s.id===candidate.id);
      if(!share||share.inlineSlides?.length!==candidate.inlineSlides.length)
        throw Error('La relazione è cambiata. Nessun dato eliminato.');
      const slides=share.inlineSlides.map(s=>({...s,images:{}}));
      const update={...share,inlineSlides:slides,slideArchive:archive};
      const shares=state.shares.map(s=>s.id===share.id?update:s);
      tx.update(ref,{shares});
    });
    setMigrationStatus('3/3 · Operazione completata: slide collegate a GitHub, database alleggerito.');
    alert('Collegamento completato! Verifica la nuova percentuale in alto.');
  }catch(err){
    setMigrationStatus('ERRORE: '+(err.code||'')+' '+(err.message||err));
    console.error('Migrazione slide non riuscita',err);
  }finally{
    migrationBusy=false;
    render();
  }
}
function storageMeter(){
  const limit=850000; // limite prudenziale dell'importazione nell'app
  const bytes=new TextEncoder().encode(JSON.stringify(persistedState||{})).length;
  const remaining=Math.max(0,limit-bytes);
  const percent=Math.min(100,Math.round(bytes/limit*100));
  const count=(appState.shares||[]).length;
  const images=(appState.shares||[]).reduce((total,s)=>total+(s.inlineSlides||[])
    .reduce((n,slide)=>n+(['it','en','fr','es','pt'].filter(l=>s.slideArchive||Boolean(slide.images?.[l])).length),0),0);
  const kb=n=>Math.round(n/1024);
  const near=percent>=75;
  const div=e('div',{style:{margin:'12px auto',padding:'14px 18px',maxWidth:'820px',borderRadius:'12px',
    background:'rgba(200,169,110,.07)',border:'1px solid rgba(200,169,110,.3)',
    color:'#e8dcc8',fontSize:'13px',lineHeight:'1.6'}},
    e('strong',{style:{color:near?'#ffbb94':'#c8a96e'}},'📦 Spazio condivisioni e slide · '+percent+'%'),
    e('p',{},'Occupazione stimata: '+kb(bytes)+' KB · Ancora disponibili: circa '+kb(remaining)+' KB'),
    e('div',{style:{height:'9px',width:'100%',background:'#36313a',borderRadius:'8px',margin:'9px 0'}},
      e('div',{style:{height:'9px',width:percent+'%',background:near?'#dba07e':'#c8a96e',borderRadius:'8px'}})),
    e('p',{},count+' condivisioni · '+images+' immagini delle slide nelle varie lingue'),
    e('p',{style:{color:near?'#ffbb94':'#a09080',fontSize:'12px'}},
      near?'Attenzione: spazio quasi esaurito. Non caricare un nuovo pacchetto con molte slide senza riorganizzare i file.':
      'Stima sul documento principale. Aggiornata automaticamente dopo ogni salvataggio o importazione.'),
    e('p',{style:{color:'#a09080',fontSize:'11px'}},
      'Il limite di sicurezza di 850 KB è fissato dal codice; non indica lo spazio totale del piano Firebase.'));
  const needsMigration=(appState.shares||[]).some(s=>(s.inlineSlides||[]).some(sl=>
    Object.values(sl.images||{}).some(v=>typeof v==='string'&&v.startsWith('data:image/'))));
  if(needsMigration)div.append(
    e('p',{style:{color:'#e8dcc8',marginTop:'9px'}},
      'Archivio GitHub caricato: ora verifica il collegamento senza cancellare le immagini prima del controllo.'),
    e('p',{id:'slide-migration-status',role:'status',
      style:{color:'#ffd08b',fontWeight:'bold',marginTop:'7px',whiteSpace:'pre-wrap'}},migrationStatus),
    e('a',{href:'https://github.com/dan73-73/meeting-coppie/upload/main/slide-archives',
      target:'_blank',rel:'noopener noreferrer',style:{color:'#e8c87a'}},
      '1. Apri GitHub per caricare lo ZIP delle slide'),
    e('div',{style:{marginTop:'8px'}},
      e('button',{id:'migrate-slide-archive',disabled:migrationBusy,
        style:{padding:'9px 13px',borderRadius:'8px',border:'1px solid #c8a96e',
          background:'#282137',color:'#e8dcc8',cursor:'pointer'},
        onClick:()=>{setMigrationStatus('Richiesta ricevuta. Verifica in corso…');migrateExistingSlides().catch(err=>setMigrationStatus('ERRORE: '+(err.message||err)));}},
        '2. Verifica archivio e libera spazio Firebase'))
  );
  return div;
}
// ═══ RENDER ═══
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const demoBar = e("div", { style:{display:"flex", alignItems:"center", gap:"8px", padding:"8px 16px", background:"rgba(200,169,110,0.06)", borderBottom:"1px solid rgba(200,169,110,0.12)", fontSize:"13px"} },
    e("span", { style:{color:"#c8a96e", marginRight:"4px"} }, "Vista:"),
    e("button", {
      style:{padding:"4px 14px", borderRadius:"20px", border:`1px solid ${currentView==="admin"?"#c8a96e":"rgba(200,169,110,0.3)"}`, background:currentView==="admin"?"rgba(200,169,110,0.2)":"transparent", color:"#c8a96e", cursor:"pointer", fontSize:"13px"},
      onClick:()=>{window.location.hash="";currentView="admin";render();}
    }, "🔐 Admin"),
    e("button", {
      style:{padding:"4px 14px", borderRadius:"20px", border:`1px solid ${currentView==="couple"?"#c8a96e":"rgba(200,169,110,0.3)"}`, background:currentView==="couple"?"rgba(200,169,110,0.2)":"transparent", color:"#c8a96e", cursor:"pointer", fontSize:"13px"},
      onClick:()=>{window.location.hash="couple";currentView="couple";render();}
    }, "💞 Vista Coppie")
  );
  app.appendChild(demoBar);
  if(currentView==='admin'&&adminAuth)app.appendChild(storageMeter());
  try {
    app.appendChild(currentView==="couple" ? renderCouple() : renderAdmin());
  } catch (err) {
    console.error("Errore visualizzazione Meeting Coppie:", err);
    const panel = document.createElement("div");
    panel.style.cssText = "max-width:750px;margin:32px auto;padding:24px;border:1px solid #b77;border-radius:14px;color:#ffcfba;background:#211421;line-height:1.6;white-space:pre-wrap";
    panel.textContent = "Errore di visualizzazione: " + (err?.message || String(err)) + "\n\nLe condivisioni salvate non sono state eliminate. Comunica questo messaggio per correggere il problema.";
    app.appendChild(panel);
  }
}

onAuthStateChanged(auth, user => {
  adminAuth = !!user && user.uid === ADMIN_UID;
  reading.sync();
  render();
  attemptAutomaticMigration();
});

await initState();
subscribeState(state => {
  const previous=appState;
  persistedState={...DEFAULT_STATE,...state};
  appState=applyPublicLocalCache(persistedState);
  loadPublicInBackground(persistedState);
  reading.sync();
  const before=previous?.readingFollow,after=appState.readingFollow;
  const sameContext=currentView==='couple' && coupleLang && before && after &&
    before.shareId===after.shareId && before.session===after.session &&
    before.revision===after.revision && before.index!==after.index &&
    previous.activeShareId===appState.activeShareId &&
    previous.displayMode===appState.displayMode &&
    previous.shares?.length===appState.shares?.length &&
    previous.shares?.every((s,i)=>s.id===appState.shares[i]?.id &&
      s.readingBlocks?.length===appState.shares[i]?.readingBlocks?.length &&
      s.inlineSlides?.length===appState.shares[i]?.inlineSlides?.length) &&
    previous.sections?.length===appState.sections?.length;
  if(sameContext && reading.updateHighlight(after.shareId,after.index))return;
  render();
  attemptAutomaticMigration();
});
</script>
