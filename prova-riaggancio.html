<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova riaggancio automatico</title>
<style>
body{font:18px system-ui;background:#141321;color:#f5efdf;max-width:1000px;margin:auto;padding:24px}
label{display:block;margin:16px 0}select,button{font:inherit;padding:12px;border-radius:8px;max-width:100%}
button{background:#d8ba79;border:0;margin:5px}p{line-height:1.6}
#heard{min-height:3em;background:#252334;padding:12px}article{padding:12px 18px;border-left:4px solid transparent;white-space:pre-wrap}
article.active{border-color:#d8ba79;background:#403a2b}#status{color:#edd08e}
#controls{position:sticky;top:0;background:#141321;padding:10px 0;z-index:1}
</style>
</head>
<body>
<h1>Prova riaggancio automatico</h1>
<p>Leggi una condivisione, fai una pausa e riprendi più avanti. L’evidenziazione di questa prova viene mostrata soltanto su questa pagina.</p>
<label>Condivisione <select id="share"></select></label>
<label>Lingua letta <select id="lang"><option value="it">Italiano</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="pt">Português</option></select></label>
<div id="controls"><button id="start" disabled>Avvia prova</button><button id="stop">Ferma</button><button id="reset">Riparti dall’inizio</button>
<p id="status" role="status">Caricamento delle condivisioni…</p><div id="heard">Le parole riconosciute appariranno qui.</div></div>
<div id="text"></div>
<script type="module">
import {createMicrophone} from './microphone-engine.mjs';
import {createRecoveryMatcher} from './reading-recovery.mjs';
import {suggestBlocks,shortenLongReadingBlocks} from './reading-follow.mjs';
import {preparePublicSlideReading} from './reading-slide-segments.mjs';
import {loadPublicText} from './public-relations.mjs';
import {slideAt} from './reading-slides-test.mjs';
const byId=id=>document.getElementById(id);
const locales={it:'it-IT',en:'en-US',fr:'fr-FR',es:'es-ES',pt:'pt-PT'};
let shares=[],blocks=[],current=0,match=null,generation=0;
const element=(tag,attrs,...children)=>{
 const node=document.createElement(tag);
 for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);
 node.append(...children);return node;
};
function highlight(index){
 byId('text').querySelector('.active')?.classList.remove('active');
 current=index;
 const node=document.getElementById('passage-'+index);
 node?.classList.add('active');
}
const mic=createMicrophone({
 Recognition:window.SpeechRecognition||window.webkitSpeechRecognition,
 onStatus:text=>byId('status').textContent=text,
 onTranscript:event=>{
  for(let i=event.resultIndex;i<event.results.length;i++){
   const transcript=event.results[i][0].transcript;
   byId('heard').textContent=transcript;
   const begin=performance.now();
   const found=match?.(transcript,current);
   const elapsed=Math.round(performance.now()-begin);
   if(found!==null && found!==undefined){
    highlight(found);
    byId('status').textContent='Passaggio '+(found+1)+' di '+blocks.length+' · ricerca '+elapsed+' ms';
   }else{
    byId('status').textContent='Ascolto altre parole per individuare il punto.';
   }
  }
 }
});
async function select(){
 const request=++generation;
 mic.stop();byId('start').disabled=true;match=null;
 const lang=byId('lang').value;
 let share=shares[Number(byId('share').value)];
 try{
  if(share.publicTextFile){
   const source=await loadPublicText(share.publicTextFile);
   const prepared=share.publicSlidePositions?.length
    ?preparePublicSlideReading(source.translations,share.publicSlidePositions)
    :{readingBlocks:shortenLongReadingBlocks(suggestBlocks(source.translations).blocks,source.translations)};
   share={...share,translations:source.translations,...prepared};
  }
  if(request!==generation)return;
  const valid=share.readingBlocks?.length&&Object.keys(locales).every(l=>share.readingBlocks.map(b=>b[l]||'').join('')===share.translations[l]?.body);
  blocks=valid?share.readingBlocks:shortenLongReadingBlocks(suggestBlocks(share.translations).blocks,share.translations);
  match=createRecoveryMatcher(blocks,lang);
  byId('text').replaceChildren(...slideAt(share,lang,-1,element));
  blocks.forEach((block,index)=>{
   byId('text').append(element('article',{id:'passage-'+index},block[lang]),...slideAt(share,lang,index,element));
  });
  highlight(0);byId('heard').textContent='Le parole riconosciute appariranno qui.';
  byId('status').textContent='Pronto. Premi Avvia prova e consenti il microfono.';
  byId('start').disabled=false;
 }catch(error){if(request===generation)byId('status').textContent=error.message;}
}
byId('start').onclick=()=>{try{mic.start(locales[byId('lang').value]);}catch(error){byId('status').textContent=error.message;}};
byId('stop').onclick=()=>mic.stop();
byId('reset').onclick=()=>{mic.stop();highlight(0);byId('heard').textContent='Premi Avvia prova per ripartire.';};
byId('lang').onchange=select;byId('share').onchange=select;
function decode(value){
 if('mapValue'in value)return Object.fromEntries(Object.entries(value.mapValue.fields||{}).map(([k,v])=>[k,decode(v)]));
 if('arrayValue'in value)return (value.arrayValue.values||[]).map(decode);
 if('integerValue'in value)return Number(value.integerValue);
 return Object.values(value)[0];
}
try{
 const response=await fetch('https://firestore.googleapis.com/v1/projects/meeting---coppie/databases/(default)/documents/state/main',{cache:'no-store'});
 if(!response.ok)throw Error('Impossibile leggere il programma ('+response.status+').');
 const data=await response.json();
 const state=Object.fromEntries(Object.entries(data.fields).map(([k,v])=>[k,decode(v)]));
 shares=state.shares||[];
 const sections=Object.fromEntries((state.sections||[]).map(s=>[s.id,s.label]));
 shares.forEach((s,i)=>byId('share').append(element('option',{value:i},(sections[s.sectionId]||'')+' – '+(s.translations?.it?.title||s.coupleName))));
 const friday=shares.findIndex(s=>s.id==='s1793894800504-0');
 byId('share').value=Math.max(0,friday);
 await select();
}catch(error){byId('status').textContent=error.message;}
</script>
</body></html>
